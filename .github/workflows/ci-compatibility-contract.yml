name: Compatibility Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    name: ci/compatibility-contract
    uses: OpsNexusHQ/opsnexus-deployment/.github/workflows/ci-compatibility-contract.yml@09fa80119f293b2dffe508a957c3a5f99b75509b
    with:
      api_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_manifest_sha: f692608bfe837f19625cc4f7208aee70c1fdfc43
