name: Compatibility Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    name: ci/compatibility-contract
    uses: OpsNexusHQ/opsnexus-deployment/.github/workflows/ci-compatibility-contract.yml@93830bed4c4c5c9bf53a68d8a8c2a3c32b6974ae
    with:
      api_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_manifest_sha: ${{ github.event.pull_request.base.sha || github.sha }}
