name: Compatibility Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    name: ci/compatibility-contract
    uses: OpsNexusHQ/opsnexus-deployment/.github/workflows/ci-compatibility-contract.yml@d42f8584068852de70aebc4b33c1c29d575464b8
    with:
      api_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_manifest_sha: ${{ github.event.pull_request.base.sha || github.sha }}
