name: Compatibility Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-contract:
    name: ci/compatibility-contract
    uses: OpsNexusHQ/opsnexus-deployment/.github/workflows/ci-compatibility-contract.yml@7fa0ed39de85d28c2104ed71c9ed3ed51c1ff148
    with:
      api_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_manifest_sha: ${{ github.event.pull_request.base.sha || github.sha }}
